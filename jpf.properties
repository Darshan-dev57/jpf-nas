jpf-nas = ${config_path}

@using jpf-core

# Model classes live on the JPF classpath (JPF only aggregates
# <project>.classpath, not <project>.boot_classpath, into the system classpath)
jpf-nas.classpath = \
  ${jpf-nas}/build/jpf-nas-classes.jar;\
  ${jpf-nas}/build/classes/java/main;\
  ${jpf-nas}/build/classes/java/test;\
  ${jpf-nas}/build/jpf-nas-examples.jar

# Native peers (host JVM) + libs for examples
jpf-nas.native_classpath = \
  ${jpf-nas}/build/jpf-nas.jar;\
  ${jpf-nas}/lib/*.jar

jpf-nas.peer_packages = nas.java.net
vm.class = nas.NasVM
vm.scheduler_factory.class = gov.nasa.jpf.vm.DistributedSchedulerFactory
vm.process_finalizers = true
vm.nas.initiating_target = -1

target=nas.util.test.TestNasJPF
