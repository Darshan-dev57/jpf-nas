import org.gradle.internal.jvm.Jvm

plugins {
    id 'java'
    id 'maven-publish'
    id 'jacoco'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    def jpfCoreJar = jpf.Jar.getFullPath()
    def jpfCoreDir = new File(jpfCoreJar).parent
    implementation files(jpfCoreJar)
    implementation files("${jpfCoreDir}/jpf-classes.jar")
    // Local libraries
    implementation fileTree(dir: 'lib', include: ['*.jar'])
    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main', 'src/peers']
        }
    }
    test {
        java {
            srcDirs = ['src/tests']
        }
        resources {
            srcDirs = ['src/tests/resources']
        }
    }
}

tasks.register('compileModelClasses', Exec) {
    // Adjust these paths as needed for your project structure
    def srcDir = file('src/classes')
    def outDir = file("$buildDir/model-classes")
    def javaHome = Jvm.current().javaHome

    inputs.dir srcDir
    outputs.dir outDir

    // Find all .java files under src/classes
    def javaFiles = fileTree(dir: srcDir, include: '**/*.java').files.collect { it.path }

    // Only run if there are java files
    onlyIf { !javaFiles.isEmpty() }

    doFirst {
        outDir.mkdirs()
    }

    // The actual javac command
    commandLine = [
            "${javaHome}/bin/javac",
            '--patch-module', "java.base=${srcDir}",
            '-d', outDir
    ] + javaFiles
}


tasks.register('modelJar', Jar) {
    dependsOn compileModelClasses
    archiveBaseName = 'jpf-nas-classes'
    from("$buildDir/model-classes")
    manifest {
        attributes(
                'Implementation-Title': 'JPF NAS Model Classes',
                'Implementation-Version': '1.0'
        )
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '--add-exports', 'java.base/sun.net.www.protocol.http=ALL-UNNAMED',
            '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-reads', 'java.base=ALL-UNNAMED'
    ]
}

test {
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
    }
    jvmArgs = [
            '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-exports', 'java.base/sun.net.www.protocol.http=ALL-UNNAMED'
    ]
    maxHeapSize = "1024m"
    forkEvery = 1
}

jar {
    archiveBaseName = 'jpf-nas'
    from sourceSets.main.output
    manifest {
        attributes(
                'Implementation-Title': 'Java Pathfinder NAS extension',
        )
    }
}

artifacts {
    archives modelJar
}


publishing {
    publications {
        core(MavenPublication) {
            artifact jar
            groupId = 'gov.nasa'
            artifactId = 'jpf-nas'
        }
        model(MavenPublication) {
            artifact modelJar
            groupId = 'gov.nasa'
            artifactId = 'jpf-nas-classes'
        }
    }
}
