plugins {
    id 'java'
    id 'maven-publish'
    id 'jacoco'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    // JPF-core jars (adjust path as needed)
    implementation files("/home/finn/jpf-push/jpf-core/build/jpf.jar")
    implementation files("/home/finn/jpf-push/jpf-core/build/jpf-classes.jar")
    // Local libraries
    implementation fileTree(dir: 'lib', include: ['*.jar'])
    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main', 'src/peers', 'src/classes']
        }
    }
    test {
        java {
            srcDirs = ['src/tests']
        }
        resources {
            srcDirs = ['src/tests/resources']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '--add-exports', 'java.base/sun.net.www.protocol.http=ALL-UNNAMED',
            '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-reads', 'java.base=ALL-UNNAMED'
    ]
}

test {
    useJUnit()
    testLogging {
        events "passed", "skipped", "failed"
    }
    jvmArgs = [
            '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-exports', 'java.base/sun.net.www.protocol.http=ALL-UNNAMED'
    ]
    maxHeapSize = "1024m"
    forkEvery = 1
}

jar {
    archiveBaseName = 'jpf-nas'
    from sourceSets.main.output
    manifest {
        attributes(
                'Implementation-Title': 'Java Pathfinder NAS extension',
                'Implementation-Version': '1.0'
        )
    }
}

publishing {
    publications {
        jpfNas(MavenPublication) {
            groupId = 'gov.nasa'
            artifactId = 'jpf-nas'
            artifact jar
        }
    }
}
